<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>{{title}}</title>


  <style>
/* ================================
   AirFleet Manager – Modern UI
   ================================ */

/* -------- Font -------- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* -------- Theme -------- */
:root {
  --bg-main: #0b1220;
  --bg-card: #121a2b;
  --bg-input: #020617;

  --border: #1e293b;

  --text-main: #e5e7eb;
  --text-muted: #94a3b8;

  --primary: #38bdf8;
  --primary-hover: #0ea5e9;

  --danger: #ef4444;
  --success: #22c55e;

  --radius: 14px;
}

/* -------- Reset -------- */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

/* -------- Base -------- */
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: radial-gradient(circle at top, #0f172a, var(--bg-main));
  color: var(--text-main);
  padding: 2rem;
}

/* -------- Links -------- */
a {
  color: var(--primary);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* -------- Topbar -------- */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2.5rem;
}

.topbar h1 {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: .5px;
}

/* -------- Cards -------- */
.card {
  background: linear-gradient(180deg, #121a2b, #0e1626);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.6rem;
  margin-bottom: 1.8rem;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

.card h2 {
  margin-top: 0;
  font-size: 1.3rem;
  font-weight: 600;
}

/* -------- Text -------- */
.muted {
  color: var(--text-muted);
  font-size: .9rem;
}

/* -------- Forms -------- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.2rem;
}

.field {
  display: flex;
  flex-direction: column;
  gap: .35rem;
}

label {
  font-size: .85rem;
  color: var(--text-muted);
}

/* -------- Inputs -------- */
input,
select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: .6rem .7rem;
  border-radius: 9px;
  font-size: .95rem;
}

input:focus,
select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 1px rgba(56,189,248,.4);
}

/* -------- Buttons -------- */
button {
  border: none;
  border-radius: 9px;
  padding: .6rem 1.2rem;
  font-size: .95rem;
  cursor: pointer;
  transition: all .15s ease;
}

button.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
  color: #020617;
  font-weight: 600;
}

button.primary:hover {
  opacity: .9;
  transform: translateY(-1px);
}

button.danger {
  background: var(--danger);
  color: white;
}

button.danger:hover {
  opacity: .85;
}

/* -------- Table -------- */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
}

.data-table th,
.data-table td {
  padding: .7rem;
  border-bottom: 1px solid var(--border);
}

.data-table th {
  text-align: left;
  font-weight: 500;
  font-size: .85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}

.data-table tr:hover {
  background: rgba(56,189,248,.07);
}

/* -------- Actions -------- */
.actions {
  display: flex;
  gap: .4rem;
}

.actions a {
  font-size: .85rem;
}

/* -------- Status badges -------- */
.badge {
  display: inline-block;
  padding: .25rem .55rem;
  font-size: .75rem;
  border-radius: 999px;
  font-weight: 600;
}

.badge.active {
  background: rgba(34,197,94,.15);
  color: #22c55e;
}

.badge.maintenance {
  background: rgba(234,179,8,.15);
  color: #eab308;
}

.badge.retired {
  background: rgba(239,68,68,.15);
  color: #ef4444;
}

/* -------- Responsive -------- */
@media (max-width: 700px) {
  body {
    padding: 1rem;
  }

  .topbar h1 {
    font-size: 1.4rem;
  }
}

  </style>

</head>
<body>

  <!-- Top navigation -->
  <header class="topbar">
    <h1>{{heading}}</h1>
    <nav>
      <a href="/">Domů</a>
    </nav>
  </header>

  <!-- Page content -->
  <main>
    {{content}}
  </main>

  <!-- Main JS -->
  <script src="/public/app.js"></script>
</body>
</html>
