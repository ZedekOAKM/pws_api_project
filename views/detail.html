<div class="card">
  <h2>Detail letadla</h2>
  <p><b>ID:</b> {{id}}</p>
  <p><b>Imatrikulace:</b> {{registration}}</p>
  <p><b>Model:</b> {{model}}</p>
  <p><b>Výrobce:</b> {{manufacturer}}</p>
  <p><b>Kapacita:</b> {{capacity}}</p>
  <p><b>Dolet (km):</b> {{range}}</p>
  <p><b>Stav:</b> {{status}}</p>

  <div class="actions">
    <a href="/edit/{{id}}">Upravit</a>
    <button data-delete-id="{{id}}">Smazat</button>
    <a class="muted" href="/">Zpět na seznam letadel</a>
  </div>
</div>
